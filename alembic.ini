# alembic.ini
#
# IMPORTANT: sqlalchemy.url here is a STATIC PLACEHOLDER only.
# The real DATABASE_URL is read from src/rcm/core/config.Settings at runtime
# in src/migrations/env.py. Do not set it here — it would silently override.

[alembic]
script_location = src/migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = OVERRIDDEN_AT_RUNTIME_BY_env_py
timezone = UTC

[post_write_hooks]
# (none configured)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
