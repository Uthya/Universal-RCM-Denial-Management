[project]
name = "rcm"
version = "2.0.0"
description = "Universal RCM Denial Management — v2 (multi-variant: 837P/I/D + 835)"
requires-python = ">=3.12,<3.13"
readme = "README.md"

dependencies = [
    # Web
    "fastapi>=0.115.0,<0.117.0",
    "uvicorn[standard]>=0.32.0,<0.36.0",
    "python-multipart>=0.0.12",

    # Config
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",

    # DB
    "sqlalchemy[asyncio]>=2.0.36,<2.1.0",
    "asyncpg>=0.30.0,<0.31.0",
    "alembic>=1.14.0,<1.16.0",
    "pgvector>=0.3.6,<0.5.0",

    # Auth (scaffolded; not wired up in this phase)
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",

    # Background jobs (scaffolded)
    "arq>=0.26.0,<0.27.0",
    "redis>=5.2.0,<6.0.0",

    # ML
    "xgboost>=2.1.0,<2.3.0",
    "scikit-learn>=1.5.0,<1.7.0",
    "pandas>=2.2.0,<2.3.0",
    "numpy>=1.26.0,<2.3.0",
    "optuna>=4.0.0,<5.0.0",
    "joblib>=1.4.0,<2.0.0",
    "shap>=0.46.0,<0.48.0",

    # Logging
    "structlog>=24.4.0,<26.0.0",

    # Utility
    "python-dateutil>=2.9.0,<3.0.0",
    "tenacity>=9.0.0,<10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<0.26.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "aiosqlite>=0.20.0,<0.22.0",
    "httpx>=0.28.0,<0.29.0",
    "ruff>=0.7.0,<0.13.0",
    "mypy>=1.13.0,<1.20.0",
    "types-python-dateutil>=2.9.0,<3.0.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rcm"]

[tool.uv]
package = true

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "E501",   # line length (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
"src/migrations/versions/*" = ["E402", "F401"]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
